name: Refresh AI Radar news snapshot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate news snapshot
        run: node scripts/build-news.js
        env:
          # Optional: enables the LLM summarization path. Without this secret the
          # pipeline falls back to the deterministic extractive summarizer.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/db
          git diff --cached --quiet || git commit -m "chore: refresh AI Radar news snapshot"
          git push